name: Release Windows App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}" -replace '^windows-v', ''
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Flutter app (nagarik_calendar.exe)
      # -----------------------------------------------------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate code (Riverpod / Freezed)
        working-directory: flutter_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Windows app
        working-directory: flutter_app
        run: flutter build windows --release --verbose

      # -----------------------------------------------------------------------
      # WPF tray app (NagarikPatro.exe)
      # -----------------------------------------------------------------------

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore WPF dependencies
        run: dotnet restore windows_app/NagarikPatro/NagarikPatro.csproj

      - name: Publish WPF tray app (self-contained single-file)
        shell: pwsh
        run: |
          dotnet publish windows_app/NagarikPatro/NagarikPatro.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o publish/NagarikPatro

      # -----------------------------------------------------------------------
      # Bundle: copy Flutter output into the same folder as the tray app
      # The tray app's FindFlutterApp() checks AppContext.BaseDirectory first.
      # -----------------------------------------------------------------------

      - name: Bundle Flutter output with tray app
        shell: pwsh
        run: |
          $flutterOut = "flutter_app\build\windows\x64\runner\Release"
          $dest       = "publish\NagarikPatro"
          # Copy exe + all DLLs
          Copy-Item "$flutterOut\*.exe" $dest -Force
          Copy-Item "$flutterOut\*.dll" $dest -Force
          # Merge data folder (Flutter assets, fonts, ICU, etc.) — dest\data may already exist
          $destData = "$dest\data"
          if (!(Test-Path $destData)) { New-Item -ItemType Directory $destData | Out-Null }
          Copy-Item "$flutterOut\data\*" $destData -Recurse -Force

      # -----------------------------------------------------------------------
      # NSIS installer
      # -----------------------------------------------------------------------

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $publishDir = (Resolve-Path "publish\NagarikPatro").Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DAPP_VERSION=${{ steps.version.outputs.VERSION }} `
            "/DPUBLISH_DIR=$publishDir" `
            windows_app\installer.nsi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.version.outputs.VERSION }}
          name: Nagarik Patro for Windows v${{ steps.version.outputs.VERSION }}
          body: |
            ## Nagarik Patro — Windows v${{ steps.version.outputs.VERSION }}

            Includes the system tray widget **and** the full Nagarik Patro app in one installer.

            ### Install
            1. Download `NagarikPatro-windows-x64-v${{ steps.version.outputs.VERSION }}-setup.exe`
            2. Run the installer — no administrator rights needed
            3. Nagarik Patro launches automatically after install
            4. Right-click the tray icon → **Launch at Login** to auto-start with Windows

            ### Uninstall
            Settings → Add or Remove Programs → Nagarik Patro → Uninstall

            ### Requirements
            - Windows 10 or 11 (x64)
            - No .NET or Flutter runtime needed — everything is bundled
          draft: false
          prerelease: false
          files: NagarikPatro-windows-x64-v${{ steps.version.outputs.VERSION }}-setup.exe
