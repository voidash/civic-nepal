name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.2)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows: Flutter app + WPF tray app bundled into an NSIS installer
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate code (Riverpod / Freezed)
        working-directory: flutter_app
        run: dart run build_runner build --delete-conflicting-outputs

      # The lua_engine plugin compiles Lua from source, and those sources are
      # gitignored rather than vendored.
      - name: Fetch Lua sources
        shell: bash
        run: ./scripts/fetch_lua.sh

      - name: Build Flutter Windows app
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish WPF tray app (self-contained single-file)
        shell: pwsh
        run: |
          dotnet publish windows_app/NagarikPatro/NagarikPatro.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o publish/NagarikPatro

      - name: Bundle Flutter output with tray app
        shell: pwsh
        run: |
          $flutterOut = "flutter_app\build\windows\x64\runner\Release"
          $dest       = "publish\NagarikPatro"
          Copy-Item "$flutterOut\*.exe" $dest -Force
          Copy-Item "$flutterOut\*.dll" $dest -Force
          $destData = "$dest\data"
          if (!(Test-Path $destData)) { New-Item -ItemType Directory $destData | Out-Null }
          Copy-Item "$flutterOut\data\*" $destData -Recurse -Force

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $publishDir = (Resolve-Path "publish\NagarikPatro").Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DAPP_VERSION=${{ steps.version.outputs.VERSION }} `
            "/DPUBLISH_DIR=$publishDir" `
            windows_app\installer.nsi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Nagarik Patro v${{ steps.version.outputs.VERSION }}
          body: |
            ## Nagarik Patro v${{ steps.version.outputs.VERSION }}

            ### Windows
            Download `NagarikPatro-windows-x64-v${{ steps.version.outputs.VERSION }}-setup.exe`
            - Run the installer — no administrator rights needed
            - Nagarik Patro launches automatically after install
            - Right-click the tray icon → **Launch at Login** to auto-start with Windows
            - Uninstall: Settings → Add or Remove Programs → Nagarik Patro
            - Requirements: Windows 10/11 x64 — no .NET or Flutter runtime needed

            ### macOS
            Download `NagarikPatro-macos-v${{ steps.version.outputs.VERSION }}.dmg`
            - Open the DMG and drag both apps to Applications:
              - `Nagarik Patro.app` — menu bar widget
              - `nepal_civic.app` — full calendar app
            - Requirements: macOS 14 (Sonoma) or later

            > **macOS security note:** Ad-hoc signed. Right-click → Open on first launch, or run:
            > `xattr -cr /Applications/Nagarik\ Patro.app /Applications/nepal_civic.app`
          draft: false
          prerelease: false
          files: NagarikPatro-windows-x64-v${{ steps.version.outputs.VERSION }}-setup.exe

  # ---------------------------------------------------------------------------
  # macOS: Flutter app + Swift menu bar app bundled into a DMG
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate code (Riverpod / Freezed)
        working-directory: flutter_app
        run: dart run build_runner build --delete-conflicting-outputs

      # The lua_engine plugin compiles Lua from source, and those sources are
      # gitignored rather than vendored.
      - name: Fetch Lua sources
        run: ./scripts/fetch_lua.sh

      - name: Build Flutter macOS app
        working-directory: flutter_app
        run: flutter build macos --release

      - name: Resolve Swift package dependencies
        working-directory: macos_app/NagarikPatro
        run: |
          xcodebuild -resolvePackageDependencies \
            -project NagarikPatro.xcodeproj \
            -scheme NagarikPatro

      - name: Build native menu bar app
        working-directory: macos_app/NagarikPatro
        run: |
          xcodebuild \
            -project NagarikPatro.xcodeproj \
            -scheme NagarikPatro \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ steps.version.outputs.VERSION }}

      - name: Prepare DMG staging folder
        run: |
          mkdir -p dmg_stage
          cp -r "flutter_app/build/macos/Build/Products/Release/nepal_civic.app" dmg_stage/
          cp -r "macos_app/NagarikPatro/build/Build/Products/Release/Nagarik Patro.app" dmg_stage/

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          hdiutil create \
            -volname "Nagarik Patro $VERSION" \
            -srcfolder dmg_stage \
            -ov \
            -format UDZO \
            "NagarikPatro-macos-v${VERSION}.dmg"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Nagarik Patro v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: NagarikPatro-macos-v${{ steps.version.outputs.VERSION }}.dmg
