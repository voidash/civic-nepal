name: Release Windows App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}" -replace '^windows-v', ''
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Flutter app (nagarik_calendar.exe)
      # -----------------------------------------------------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate code (Riverpod / Freezed)
        working-directory: flutter_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Windows app
        working-directory: flutter_app
        run: flutter build windows --release --verbose

      # -----------------------------------------------------------------------
      # WPF tray app (NagarikPatro.exe)
      # -----------------------------------------------------------------------

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore WPF dependencies
        run: dotnet restore windows_app/NagarikPatro/NagarikPatro.csproj

      - name: Publish WPF tray app (self-contained single-file)
        shell: pwsh
        run: |
          dotnet publish windows_app/NagarikPatro/NagarikPatro.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o publish/NagarikPatro

      # -----------------------------------------------------------------------
      # Bundle: copy Flutter output into the same folder as the tray app
      # The tray app's FindFlutterApp() checks AppContext.BaseDirectory first.
      # -----------------------------------------------------------------------

      - name: Bundle Flutter output with tray app
        shell: pwsh
        run: |
          $flutterOut = "flutter_app\build\windows\x64\runner\Release"
          $dest       = "publish\NagarikPatro"
          # Copy exe + all DLLs
          Copy-Item "$flutterOut\*.exe" $dest
          Copy-Item "$flutterOut\*.dll" $dest
          # Copy data folder (assets, fonts, ICU, etc.)
          Copy-Item "$flutterOut\data" $dest -Recurse

      - name: Package as zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path publish/NagarikPatro/* `
            -DestinationPath NagarikPatro-windows-x64-v${{ steps.version.outputs.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.version.outputs.VERSION }}
          name: Nagarik Patro for Windows v${{ steps.version.outputs.VERSION }}
          body: |
            ## Nagarik Patro — Windows v${{ steps.version.outputs.VERSION }}

            Includes the system tray widget **and** the full Nagarik Patro app bundled together.

            ### Install
            1. Download `NagarikPatro-windows-x64-v${{ steps.version.outputs.VERSION }}.zip`
            2. Extract to a permanent location (e.g. `C:\Programs\NagarikPatro\`)
            3. Double-click `NagarikPatro.exe` — the tray icon appears immediately
            4. Right-click the tray icon → **Launch at Login** to auto-start with Windows
            5. Click the tray icon to open the calendar popup
            6. Click **Open Nagarik Patro** in the popup to open the full app

            ### Requirements
            - Windows 10 or 11 (x64)
            - No .NET or Flutter runtime needed — everything is bundled
          draft: false
          prerelease: false
          files: NagarikPatro-windows-x64-v${{ steps.version.outputs.VERSION }}.zip
