name: Update RONB Feed

# RONB posts several times an hour, so the news feed is refreshed on its own
# schedule rather than with the weekly `update-data` job.
#
# Two things this deliberately does NOT do:
#
#  1. It does not write into `flutter_app/assets/`. That path is watched by
#     `deploy-flutter.yml`, so a commit there would rebuild and redeploy the
#     whole Flutter web app every ten minutes.
#  2. It does not add to `main`'s history. The feed is force-pushed to a
#     standalone `data` branch that only ever holds a single commit, so the
#     repository does not accumulate ~144 commits a day.
#
# The app reads the result straight from raw.githubusercontent.com, which
# serves `access-control-allow-origin: *` and caches for 5 minutes.
#
# Note on timing: GitHub runs scheduled workflows on a best-effort basis and
# delays them under load, so ten minutes is the floor, not a guarantee.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Skip a queued run if a newer one is already going; a missed scrape is
# replaced by the next one a few minutes later.
concurrency:
  group: update-ronb
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scraper
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check requests

      # --min-posts fails the job rather than publishing an empty feed when
      # Facebook blocks the runner.
      - name: Scrape RONB
        id: scrape
        run: python3 scripts/scrape_ronb.py --min-posts 5 -o ronb_feed.json

      - name: Publish to data branch
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp ronb_feed.json "$work/"
          cd "$work"

          # A throwaway repo with exactly one commit, force-pushed over the
          # data branch. Nothing to rebase, nothing to accumulate.
          git init -q
          git checkout -q -b data
          git add ronb_feed.json
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -q -m "data: RONB feed $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            data

      - name: Job summary
        if: always()
        run: |
          {
            echo "## RONB feed — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            if [ "${{ steps.scrape.outcome }}" = "success" ]; then
              echo "Posts: $(python3 -c 'import json;print(json.load(open("ronb_feed.json"))["post_count"])')"
              echo ""
              echo "Published to the \`data\` branch."
            else
              echo "Scrape failed — the previously published feed is left in place."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
