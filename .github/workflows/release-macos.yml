name: Release macOS App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'macos-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=$(echo '${{ github.ref_name }}' | sed 's/^macos-v//')" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Flutter app (nepal_civic.app)
      # -----------------------------------------------------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate code (Riverpod / Freezed)
        working-directory: flutter_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter macOS app
        working-directory: flutter_app
        run: flutter build macos --release

      # -----------------------------------------------------------------------
      # Native macOS menu bar app (Nagarik Patro.app)
      # Ad-hoc signed — users may need to right-click → Open on first launch.
      # -----------------------------------------------------------------------

      - name: Resolve Swift package dependencies
        working-directory: macos_app/NagarikPatro
        run: |
          xcodebuild -resolvePackageDependencies \
            -project NagarikPatro.xcodeproj \
            -scheme NagarikPatro

      - name: Build native menu bar app
        working-directory: macos_app/NagarikPatro
        run: |
          xcodebuild \
            -project NagarikPatro.xcodeproj \
            -scheme NagarikPatro \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ steps.version.outputs.VERSION }}

      # -----------------------------------------------------------------------
      # Bundle both apps into a DMG
      # -----------------------------------------------------------------------

      - name: Prepare DMG staging folder
        run: |
          mkdir -p dmg_stage
          cp -r "flutter_app/build/macos/Build/Products/Release/nepal_civic.app" dmg_stage/
          cp -r "macos_app/NagarikPatro/build/Build/Products/Release/Nagarik Patro.app" dmg_stage/

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          hdiutil create \
            -volname "Nagarik Patro $VERSION" \
            -srcfolder dmg_stage \
            -ov \
            -format UDZO \
            "NagarikPatro-macos-v${VERSION}.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-v${{ steps.version.outputs.VERSION }}
          name: Nagarik Patro for macOS v${{ steps.version.outputs.VERSION }}
          body: |
            ## Nagarik Patro — macOS v${{ steps.version.outputs.VERSION }}

            Includes the menu bar widget **and** the full Nagarik Patro app bundled in one DMG.

            ### Install
            1. Download `NagarikPatro-macos-v${{ steps.version.outputs.VERSION }}.dmg`
            2. Open the DMG and drag **both apps** to your Applications folder:
               - `Nagarik Patro.app` — menu bar widget
               - `nepal_civic.app` — full calendar app
            3. Launch `Nagarik Patro` from Applications — it appears in your menu bar
            4. Click the menu bar icon to open the calendar popup
            5. Click **Open Nagarik Patro** to launch the full app

            > **Note:** These builds are ad-hoc signed. On first launch macOS may show a security
            > warning. Right-click the app → **Open** to allow it, or run:
            > ```
            > xattr -cr /Applications/Nagarik\ Patro.app /Applications/nepal_civic.app
            > ```

            ### Requirements
            - macOS 14 (Sonoma) or later
          draft: false
          prerelease: false
          files: NagarikPatro-macos-v${{ steps.version.outputs.VERSION }}.dmg
