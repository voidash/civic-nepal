name: Update App Data

on:
  # Weekly on Monday 02:00 UTC (Monday ~07:45 Nepal Time)
  schedule:
    - cron: '0 2 * * 1'

  workflow_dispatch:
    inputs:
      update_type:
        description: 'What to update'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - leaders
          - ministers
          - ronb

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4

      # Each source is independent: an upstream site being down must not stop
      # the others from refreshing. Failures are surfaced in the job summary.
      - name: Update leaders + parties (ratemyneta.com)
        id: leaders
        if: inputs.update_type == 'all' || inputs.update_type == 'leaders' || github.event_name == 'schedule'
        continue-on-error: true
        run: python3 scripts/fetch_leaders.py

      - name: Update ministers (opmcm.gov.np)
        id: ministers
        if: inputs.update_type == 'all' || inputs.update_type == 'ministers' || github.event_name == 'schedule'
        continue-on-error: true
        run: python3 flutter_app/scripts/update_ministers.py

      - name: Update RONB feed
        id: ronb
        if: inputs.update_type == 'all' || inputs.update_type == 'ronb' || github.event_name == 'schedule'
        continue-on-error: true
        run: python3 scripts/scrape_ronb.py --pretty -o flutter_app/assets/data/ronb_feed.json

      - name: Commit and push changes
        id: commit
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No data changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update app data ($(date -u +%Y-%m-%d))"
          git push

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Data update — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Source | Result |"
            echo "|--------|--------|"
            echo "| leaders   | ${{ steps.leaders.outcome   || 'skipped' }} |"
            echo "| ministers | ${{ steps.ministers.outcome || 'skipped' }} |"
            echo "| ronb      | ${{ steps.ronb.outcome      || 'skipped' }} |"
            echo ""
            echo "Committed: ${{ steps.commit.outputs.changed || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
